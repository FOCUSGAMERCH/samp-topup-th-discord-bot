<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title description">
  <title id="title">SA-MP top-up transaction flow</title>
  <desc id="description">Discord request, payment confirmation, MySQL transaction, then separate SA-MP server processing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#182b38"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#66d9ad"/></marker>
  </defs>
  <rect width="1120" height="300" rx="22" fill="url(#bg)"/>
  <text x="40" y="46" fill="#f2f7fb" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Top-up flow · ลำดับการเติมเงิน</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g transform="translate(28 94)"><rect width="160" height="126" rx="16" fill="#202f40" stroke="#344b60"/><text x="80" y="44" fill="#f4f7fb" font-size="17" font-weight="700">Discord</text><text x="80" y="72" fill="#aebdca" font-size="14">ผู้เล่นเลือกเติมเงิน</text><text x="80" y="96" fill="#aebdca" font-size="13">ตัวเองหรือเพื่อน</text></g>
    <g transform="translate(226 94)"><rect width="170" height="126" rx="16" fill="#202f40" stroke="#344b60"/><text x="85" y="42" fill="#f4f7fb" font-size="16" font-weight="700">Python bot</text><text x="85" y="70" fill="#aebdca" font-size="13">ตรวจ whitelist</text><text x="85" y="94" fill="#aebdca" font-size="13">รับคำขอและจำนวนเงิน</text></g>
    <g transform="translate(434 94)"><rect width="178" height="126" rx="16" fill="#203a3d" stroke="#3a7168"/><text x="89" y="40" fill="#f4f7fb" font-size="16" font-weight="700">Payment API</text><text x="89" y="68" fill="#b5d6ce" font-size="13">KBank QR / PromptPay</text><text x="89" y="92" fill="#b5d6ce" font-size="13">หรือ TrueMoney Wallet</text></g>
    <g transform="translate(650 94)"><rect width="184" height="126" rx="16" fill="#203a3d" stroke="#3a7168"/><text x="92" y="40" fill="#f4f7fb" font-size="16" font-weight="700">MySQL</text><text x="92" y="68" fill="#b5d6ce" font-size="13">topup_transactions</text><text x="92" y="92" fill="#b5d6ce" font-size="13">processed = 0</text></g>
    <g transform="translate(872 94)"><rect width="218" height="126" rx="16" fill="#282f42" stroke="#555f85"/><text x="109" y="40" fill="#f4f7fb" font-size="15" font-weight="700">SA-MP server side</text><text x="109" y="68" fill="#c3c9db" font-size="13">ประมวลผลรายการ</text><text x="109" y="92" fill="#c3c9db" font-size="13">เพิ่ม Cash · processed = 1</text></g>
  </g>
  <g fill="none" stroke="#66d9ad" stroke-width="3" marker-end="url(#arrow)">
    <path d="M190 157H218"/><path d="M398 157H426"/><path d="M614 157H642"/><path d="M836 157H864"/>
  </g>
  <text x="560" y="264" text-anchor="middle" fill="#91a4b4" font-family="Segoe UI, sans-serif" font-size="13">The SA-MP-side processor is separate from this Discord bot repository.</text>
</svg>
